name: ci drug catalog service
on:
  workflow_dispatch:
jobs:
  build:
    name: build and push docker image
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch tag
        id: fetch-tag
        run: echo "tag=$(git describe --tag --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: setup java
        uses: actions/setup-java
        with:
          distribution: 'temurian'
          version: '17'
          cache: 'maven'

      - name: compile build test
        run: mvn verify --no-transfer-progress
      
      - name: sonarqube scan
        uses: SonarSource/sonarqube-scan-action@da4450e400cebf84292b12a85d4ca0080ae2938c
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ var.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ var.SONAR_ORG }}
            -Dsonar.java.binaries=target/classes

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          region: ap-south-1
          assume-role-arn: arn:aws:iam::134448505602:role/zenpharma-dev-github-actions-role
          audience: sts.amazonaws.com

      - name: login to ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: build docker image
        id: build-image
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/drug-catalog-service:${{ steps.fetch-tag.outputs.tag }}
          docker build -t $IMAGE .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        id: trivy-scan
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: 'sarif'
          output: 'trivy-report.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'
          ignore-unfixed: true

      - name: upload trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.sarif
          retention-days: 1

      - name: push docker image
        run: |
          IMAGE=${{ steps.build-image.outputs.image }}
          docker push $IMAGE

  deploy:
    name: deploy to gitops repo
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: fetch tag
        id: fetch-tag
        run: echo "tag=$(git describe --tag --abbrev=0)" >> "$GITHUB_OUTPUT"       
 
      - name: checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ var.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }} 
          path: _gitops

      - name: update image tag in gitops repo
        run: |
          cd _gitops
          git pull

          git config user.name  "maxpain62"
          git config user.email "maxpain62@gmail.com"

          export IMAGE_TAG=${{ steps.fetch-tag.outputs.tag }}
          export CURRENT_IMAGE_TAG=$(grep "tag:" envs/dev/values-drug-catalog-service.yaml | awk '{print $2}')

          echo "Current image tag: $CURRENT_IMAGE_TAG"
          echo "New image tag: $IMAGE_TAG"

          sed -i "s/$CURRENT_IMAGE_TAG/$IMAGE_TAG/g" envs/dev/values-drug-catalog-service.yaml
          
          git add envs/dev/values-drug-catalog-service.yaml
          git push
